services:
  assets:
    build: .
    image: asset-management:latest
    container_name: asset-management
    restart: always          # 崩溃或宿主机重启后自动拉起
    ports:
      # 宿主机 12036 → 容器 8000，与原使用习惯一致
      # 只允许内网访问：改成下面这种「绑定到内网 IP」的写法（把 192.168.1.10 换成服务器内网 IP），
      # 这样即使安全组/防火墙放行了端口，外网也连不上，只有内网可访问：
      #   - "192.168.1.10:12036:8000"
      - "12036:8000"
    environment:
      # 数据库放在挂载卷里，重建容器数据不丢
      - ASSETS_DB_PATH=/app/data/db.sqlite3
      # 生产环境务必改成随机长字符串（一串无规律字母数字即可）
      - ASSETS_SECRET_KEY=please-change-me-to-a-long-random-string
      # 局域网使用可保持 *；有域名或固定 IP 建议改成具体值，如 192.168.1.10、assets.example.com
      - ASSETS_ALLOWED_HOSTS=*
      # 配了域名（尤其走 HTTPS 反代）时填，例：ASSETS_CSRF_ORIGINS=https://assets.example.com
      # 不配也能正常用 IP:端口 访问；配了域名不填此项，域名下提交表单会报 403
      - ASSETS_CSRF_ORIGINS=
      # Redis 缓存：登录锁定等跨进程状态共享；未来加 worker 无需再改代码
      - ASSETS_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data     # SQLite 数据库（把现有 db.sqlite3 拷到宿主机 ./data/ 下）
      - ./backup:/app/backup # 自动备份目录（与页面「数据备份」设置对应）
    depends_on:
      - redis

  # 轻量缓存服务：只存登录失败计数/锁定状态（内存态，无需持久化）
  redis:
    image: redis:7-alpine
    container_name: asset-redis
    restart: always
    # 不对外暴露端口，仅容器网络内部可访问
