{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:480px;">
    <div class="card-title">修改密码</div>
    <form method="post">
        {% csrf_token %}
        <div class="form-grid" style="grid-template-columns:1fr;">
            <div class="form-field">
                <label class="req">当前密码</label>
                <input type="password" name="old_password" required placeholder="请输入当前密码">
            </div>
            <div class="form-field">
                <label class="req">新密码</label>
                <input type="password" name="new_password" required placeholder="请输入新密码（至少 4 位）">
            </div>
            <div class="form-field">
                <label class="req">确认新密码</label>
                <input type="password" name="confirm_password" required placeholder="请再次输入新密码">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">保存</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
